name: SDK-free tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed v5 commit
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python tests/run_tests.py
      - run: python examples/precision_demo.py
      - run: python scripts/check_project.py
      - run: python scripts/build_source.py
